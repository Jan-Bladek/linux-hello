[package]
name = "hello-settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-only"
build = "build.rs"

[features]
face-diagnostics = ["dep:hello-cli", "hello-cli/face-opencv", "dep:zeroize"]

[dependencies]
slint.workspace = true
hello-camera.workspace = true
hello-core.workspace = true
hello-ipc.workspace = true
hello-fingerprint.workspace = true
tokio.workspace = true
serde_json.workspace = true
zeroize = { workspace = true, optional = true }
hello-cli = { path = "../../crates/hello-cli", version = "=0.1.0-dev", optional = true }

[build-dependencies]
slint-build.workspace = true
# Slint compiler accepts 3.2; later 3.x adds an unused, retired bincode codec.
# Keep this resolver constraint until the compiler supports a maintained 4.x.
typed-index-collections = "=3.2.0"

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { workspace = true, features = ["default-rt"] }
futures = "=0.3.34"
