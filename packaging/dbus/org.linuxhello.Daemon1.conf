<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny own="org.linuxhello.Daemon1"/>
    <deny send_destination="org.linuxhello.Daemon1"/>
    <allow send_destination="org.linuxhello.Daemon1"
           send_interface="org.linuxhello.Daemon1"
           send_member="GetVersion"/>
    <allow send_destination="org.linuxhello.Daemon1"
           send_interface="org.linuxhello.Daemon1"
           send_member="GetCapabilities"/>
    <allow send_destination="org.linuxhello.Daemon1"
           send_interface="org.linuxhello.Daemon1"
           send_member="GetSecurityStatus"/>
    <allow send_destination="org.linuxhello.Daemon1"
           send_interface="org.linuxhello.Daemon1"
           send_member="GetRequesterUid"/>
    <allow send_destination="org.linuxhello.Daemon1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.linuxhello.Daemon1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
  <policy user="linux-hello">
    <allow own="org.linuxhello.Daemon1"/>
  </policy>
  <policy user="root">
    <allow own="org.linuxhello.Daemon1"/>
  </policy>
</busconfig>
