[package]
name = "hello-sudo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "hello-sudo"
path = "src/main.rs"
required-features = ["sudo-face"]

[features]
sudo-face = ["dep:hello-cli", "dep:hello-camera", "dep:hello-face", "dep:hello-storage", "dep:hello-pam", "dep:serde", "dep:serde_json", "dep:tokio", "dep:libc", "dep:zeroize", "dep:getrandom"]

[dependencies]
hello-cli = { version = "=0.1.0-dev", path = "../hello-cli", features = ["face-opencv"], optional = true }
hello-camera = { workspace = true, optional = true }
hello-face = { workspace = true, optional = true }
hello-storage = { workspace = true, optional = true }
hello-pam = { workspace = true, features = ["privileged"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
