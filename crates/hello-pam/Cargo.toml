[package]
name = "hello-pam"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "hello-lock-verify"
path = "src/lock_verify.rs"
required-features = ["kde-pam"]

[features]
privileged = ["dep:libc"]
sudo-pam = ["privileged"]
kde-pam = ["sudo-pam"]

[dependencies]
hello-ipc.workspace = true
libc = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
