[workspace]
resolver = "3"
exclude = ["third-party/i-slint-backend-winit", "third-party/sctk-adwaita"]
members = ["crates/*", "apps/hello-settings"]
default-members = ["crates/hello-core", "crates/hello-camera", "crates/hello-face", "crates/hello-storage", "crates/hello-ipc", "crates/hello-fingerprint", "crates/hello-daemon", "crates/hello-pam", "crates/hello-cli"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.dependencies]
hello-core = { path = "crates/hello-core", version = "=0.1.0-dev" }
hello-camera = { path = "crates/hello-camera", version = "=0.1.0-dev" }
hello-face = { path = "crates/hello-face", version = "=0.1.0-dev" }
hello-storage = { path = "crates/hello-storage", version = "=0.1.0-dev" }
hello-ipc = { path = "crates/hello-ipc", version = "=0.1.0-dev" }
hello-fingerprint = { path = "crates/hello-fingerprint", version = "=0.1.0-dev" }
hello-pam = { path = "crates/hello-pam", version = "=0.1.0-dev" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
v4l = "=0.14.0"
zbus = { version = "=6.0.0", default-features = false, features = ["tokio", "proxy", "service", "object-manager"] }
clap = { version = "=4.6.7", features = ["derive"] }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = "=0.11.0"
zeroize = { version = "=1.9.1", features = ["derive"] }
getrandom = "=0.4.3"
tempfile = "=3.27.0"
libc = "=0.2.190"
sha2 = "=0.11.0"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
slint-build = "=1.18.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

# Reviewed compatibility patch; see third-party/README.md.
[patch.crates-io]
i-slint-backend-winit = { path = "third-party/i-slint-backend-winit" }
sctk-adwaita = { path = "third-party/sctk-adwaita" }
